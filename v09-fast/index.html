<script>
"use strict";
const bibiBgm=document.getElementById("bibiBgm");
const bgmToggle=document.getElementById("bgmToggle");
let bgmEnabled=true,bgmState="ready",bgmAttempt=0,bgmEverPlayed=false,bgmBackgroundSuspended=false,bgmResumeAfterBackground=false,introResumeAfterBackground=false;
bibiBgm.volume=0.22;
function updateBgmToggle(){
 const label=!bgmEnabled?"♫ 音乐关":bgmState==="loading"?"♫ 加载中":!bibiBgm.paused?"♫ 音乐开":"♫ 点此播放";
 bgmToggle.textContent=label;
 bgmToggle.setAttribute("aria-pressed",String(bgmEnabled));
 bgmToggle.setAttribute("aria-label",!bgmEnabled?"开启背景音乐":bgmState==="loading"?"背景音乐加载中，点击关闭":!bibiBgm.paused?"关闭背景音乐":"播放背景音乐");
}
function startBgm(){
 if(!bgmEnabled||!bibiBgm.paused||document.hidden||bgmBackgroundSuspended||phase==="pause")return;
 const attempt=++bgmAttempt;
 bgmState="loading";updateBgmToggle();
 let request;
 try{request=bibiBgm.play()}catch(error){bgmState="blocked";console.warn("BIBIBOBO BGM play failed:",error);updateBgmToggle();return}
 Promise.resolve(request).then(()=>{
  if(attempt!==bgmAttempt)return;
  bgmEverPlayed=true;bgmState="playing";updateBgmToggle();
 }).catch(error=>{
  if(attempt!==bgmAttempt)return;
  bgmState="blocked";console.warn("BIBIBOBO BGM play rejected:",error);updateBgmToggle();
 });
}
function onBgmGesture(event){
 if(document.hidden||bgmBackgroundSuspended||phase==="pause")return;
 unlockSfx();
 if(document.getElementById("brandIntro")?.classList.contains("active"))return;
 if(event.target?.closest?.("#bgmToggle"))return;
 startBgm();
}
function bindBgmFrame(frame){
 try{
  const doc=frame.contentDocument;
  if(!doc||doc.__bibiBgmBound)return;
  doc.__bibiBgmBound=true;
  doc.addEventListener("pointerdown",onBgmGesture,true);
  doc.addEventListener("touchend",onBgmGesture,{capture:true,passive:true});
  doc.addEventListener("keydown",onBgmGesture,true);
  doc.addEventListener("click",onSfxButtonClick,true);
 }catch(error){console.warn("BIBIBOBO BGM frame gesture unavailable:",error)}
}
bgmToggle.addEventListener("click",()=>{
 if(!bgmEnabled){bgmEnabled=true;bgmState="ready";startBgm()}
 else if(!bibiBgm.paused||bgmState==="loading"||phase==="pause"&&bgmResumeAfterBackground){bgmEnabled=false;bgmResumeAfterBackground=false;bgmAttempt++;bibiBgm.pause();bgmState="off"}
 else startBgm();
 updateBgmToggle();
});
bibiBgm.addEventListener("playing",()=>{bgmEverPlayed=true;bgmState="playing";updateBgmToggle()});
bibiBgm.addEventListener("waiting",()=>{if(bgmEnabled){bgmState="loading";updateBgmToggle()}});
bibiBgm.addEventListener("pause",()=>{if(bgmEnabled)bgmState="ready";updateBgmToggle()});
bibiBgm.addEventListener("error",()=>{bgmState="error";console.warn("BIBIBOBO BGM media error:",bibiBgm.error);updateBgmToggle()});
document.addEventListener("pointerdown",onBgmGesture,true);
document.addEventListener("touchend",onBgmGesture,{capture:true,passive:true});
document.addEventListener("keydown",onBgmGesture,true);

updateBgmToggle();
function suspendMediaForBackground(){
 if(bgmBackgroundSuspended)return;
 bgmBackgroundSuspended=true;

ion.hash.slice(1)).get('labelPos');\nif(urlPosition){\n const values=urlPosition.split(',').map(Number);\n if(values.length===4&&values.every(Number.isFinite)){\n  positions.next={x:values[0],y:values[1]};\n  positions.album={x:values[2],y:values[3]};\n }\n}\nfunction updateLabelPositions(){\n for(const key of ['next','album']){\n  labelElements[key].style.setProperty('--dx',positions[key].x+'px');\n  labelElements[key].style.setProperty('--dy',positions[key].y+'px');\n  labelElements[key].classList.toggle('selected',editingLabels&&selectedLabel===key);\n }\n const value='下一关：水平 '+positions.next.x+'px、垂直 '+positions.next.y+'px；回忆册：水平 '+positions.album.x+'px、垂直 '+positions.album.y+'px';\n $('positionReadout').textContent=value;\n $('positionOutput').value=value;\n try{localStorage.setItem(positionKey,JSON.stringify(positions))}catch(e){}\n try{\n  const url=new URL(location.href);\n  url.hash='labelPos='+[positions.next.x,positions.next.y,positions.album.x,positions.album.y].join(',');\n  history.replaceState(null,'',url.href);\n }catch(e){}\n}\n$('editLabels').addEventListener('click',()=>{\n editingLabels=!editingLabels;\n document.querySelector('.stage').classList.toggle('editing',editingLabels);\n $('positionPanel').hidden=!editingLabels;\n $('editLabels').textContent=editingLabels?'完成调整':'调整按钮文字';\n updateLabelPositions();\n});\n\nfor(const key of ['next','album']){\n const el=labelElements[key];\n el.addEventListener('pointerdown',e=>{\n  if(!editingLabels)return;\n  e.preventDefault();e.stopPropagation();\n  selectedLabel=key;\n  labelDrag={key,startX:e.clientX,startY:e.clientY,x:positions[key].x,y:positions[key].y};\n  el.setPointerCapture(e.pointerId);updateLabelPositions();\n });\n el.addEventListener('pointermove',e=>{\n  if(!labelDrag||labelDrag.key!==key)return;\n  positions[key].x=Math.round(labelDrag.x+e.clientX-labelDrag.startX);\n  positions[key].y=Math.round(labelDrag.y+e.clientY-labelDrag.startY);\n  updateLabelPositions();\n });\n const endDrag=()=>{if(labelDrag?.key===key)labelDrag=null};\n el.addEventListener('pointerup',endDrag);\n el.addEventListener('pointercancel',endDrag);\n}\ndocument.addEventListener('keydown',e=>{\n if(!editingLabels||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;\n if(document.activeElement?.tagName==='INPUT')return;\n e.preventDefault();\n const step=e.shiftKey?5:1,p=positions[selectedLabel];\n if(e.key==='ArrowLeft')p.x-=step;\n if(e.key==='ArrowRight')p.x+=step;\n if(e.key==='ArrowUp')p.y-=step;\n if(e.key==='ArrowDown')p.y+=step;\n updateLabelPositions();\n});\n$('resetLabels').addEventListener('click',()=>{\n positions.next={x:0,y:-3};positions.album={x:-2,y:-3};updateLabelPositions();\n});\n$('copyLabels').addEventListener('click',async()=>{\n const input=$('positionOutput');\n try{await navigator.clipboard.writeText(input.value);$('copyLabels').textContent='已复制'}\n catch(e){input.select();document.execCommand('copy');$('copyLabels').textContent='已选中位置'}\n setTimeout(()=>$('copyLabels').textContent='复制位置',1800);\n});\nupdateLabelPositions();\n$('albumLabel').closest('button').addEventListener('click',()=>{if(!editingLabels)location.href='回忆册.html?level='+active});\nlevel(Math.min(3,Math.max(1,Number(new URLSearchParams(location.search).get('level'))||2)))\n<\/script><script>\n/* 按关卡接入订单内容；此演示页默认的照片和留言只是占位。 */\nwindow.setVictoryMemory=function(n,data){\n if(!Number.isInteger(n)||n<1||n>3||!data)return false;\n const memory=memories[n-1];\n if(typeof data.message==='string')memory.message=data.message;\n if(typeof data.photo==='string')memory.photo=data.photo;\n const crop=data.crop||{};\n memory.crop={x:Number.isFinite(+crop.x)?+crop.x:0,y:Number.isFinite(+crop.y)?+crop.y:0,scale:Number.isFinite(+crop.scale)?Math.min(4,Math.max(.25,+crop.scale)):1};\n if(active===n)level(n);return true;\n};\n<\/script><\/html>";

const matchFxLayer=$("matchFxLayer");
function matchFxMotion(el,frames,duration,delay=0){
 return el.animate(frames,{duration,delay,easing:"ease-out",fill:"forwards"});
}
function matchFxNode(className,x,y,w,h,scale){
 const el=document.createElement("span");el.className=className;
 Object.assign(el.style,{left:(x-w*scale/2)+"px",top:(y-h*scale/2)+"px",width:(w*scale)+"px",height:(h*scale)+"px"});
 matchFxLayer.appendChild(el);return el;
}
function matchBurst(id){
 const cell=dragBoard.children[id],rect=cell.getBoundingClientRect(),app=$("app").getBoundingClientRect();
 const x=rect.left-app.left+rect.width/2,y=rect.top-app.top+rect.height/2,scale=rect.width/(347/8);
 const glow=matchFxNode("matchGlow",x,y,68,68,scale);
 matchFxMotion(glow,[{opacity:0,transform:"scale(.55)"},{opacity:.85,transform:"scale(1.05)",offset:.3},{opacity:0,transform:"scale(1.5)"}],420);
 const ring=matchFxNode("matchRing",x,y,28,28,scale);
 matchFxMotion(ring,[{opacity:.85,transform:"scale(.45)"},{opacity:.55,offset:.4},{opacity:0,transform:"scale(2.25)"}],370);
 for(let n=0;n<3;n++){
  const petal=matchFxNode("matchPetal",x,y,11,14,scale),dx=[-22,19,4][n]*scale,dy=[24,31,37][n]*scale,turn=[-115,130,65][n];
  matchFxMotion(petal,[{opacity:0,transform:"translate(0,0) rotate(0deg) scale(.55)"},{opacity:1,offset:.24},{opacity:0,transform:"translate("+dx+"px,"+dy+"px) rotate("+turn+"deg) scale(.8)"}],690+n*90,n*55);
 }
 for(let n=0;n<6;n++){
  const spark=matchFxNode("matchSpark"+(n%3===0?" gold":""),x,y,6,6,scale),a=n*2.39996+.2,d=(15+(n%4)*4)*scale,dx=Math.cos(a)*d,dy=Math.sin(a)*d-5*scale;
  matchFxMotion(spark,[{opacity:0,transform:"translate(0,0) rotate(0deg) scale(.4)"},{opacity:1,offset:.18},{opacity:0,transform:"translate("+dx+"px,"+dy+"px) rotate(95deg) scale(.2)"}],430+n%3*35);
 }
}
async function animateMatchClear(ids){
 if(!ids.length)return;
 matchFxLayer.replaceChildren();
 const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
 if(reduced){await wait(80);return}
 ids.forEach((id,i)=>{
  const cell=dragBoard.children[id],img=cell&&cell.querySelector("img");
  if(!img)return;
  matchBurst(id);
  matchFxMotion(img,[{transform:"scale(1)",opacity:1},{transform:"scale(1.1)",opacity:1,offset:.28},{transform:"scale(.32)",opacity:0}],330,Math.min(i,2)*35);
 });
 await wait(410);
}
async function animateGravity(){
 const falls=gravity();render();
 const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
 if(!reduced&&falls.length){
  const cells=dragBoard.children,step=cells[1].getBoundingClientRect().left-cells[0].getBoundingClientRect().left;
  for(const f of falls){
   const img=cells[f.to*W+f.col].querySelector("img");if(!img)continue;
   const dy=f.spawn?-12*(step/(347/8)):(f.from-f.to)*step;
   const delay=f.spawn?70:Math.min(105,Math.max(0,(f.bottom-f.from)*35));
   img.animate([{transform:"translateY("+dy+"px)",opacity:f.spawn?0:1},{transform:"translateY(2px) scale(1.03,.97)",opacity:1,offset:.84},{transform:"translateY(0) scale(1)",opacity:1}],{duration:390,delay,easing:"cubic-bezier(.23,.72,.24,1)",fill:"both"});
  }
  await wait(490);
 }
 matchFxLayer.replaceChildren();
}

function finishBrandIntro(){
 if(brandIntroDone)return;
 brandIntroDone=true;clearTimeout(brandIntroWatchdog);
 const intro=document.getElementById("brandIntro"),video=document.getElementById("brandIntroVideo");
 video.pause();video.removeAttribute("src");video.load();
 intro.classList.remove("active","playing","needsGesture");intro.setAttribute("aria-hidden","true");
 home();
}
function showBrandIntro(){
 const intro=document.getElementById("brandIntro"),video=document.getElementById("brandIntroVideo");
 phase="brand";stopTimer();bibiBgm.pause();intro.classList.add("active");intro.removeAttribute("aria-hidden");
 if(video.error)video.load()
 video.addEventListener("ended",finishBrandIntro,{once:true});
 video.addEventListener("error",()=>{if(!brandIntroDone){intro.classList.add("needsGesture");intro.tabIndex=0}},{once:true});
 document.getElementById("brandIntroSkip").onclick=finishBrandIntro;
 const startAudible=()=>{
  if(brandIntroDone)return;
  video.muted=false;video.volume=.22;
  let request;
  try{request=video.play()}catch(error){onBlocked(error);return}
  Promise.resolve(request).then(()=>{
   if(brandIntroDone)return;
   intro.classList.remove("needsGesture");intro.removeAttribute("tabindex");
   clearTimeout(brandIntroWatchdog);
   brandIntroWatchdog=setTimeout(()=>{if(!video.ended&&video.currentTime<video.duration-.3){intro.classList.add("needsGesture");intro.tabIndex=0}else finishBrandIntro()},30000);
  }).catch(onBlocked);
 };
 const onBlocked=error=>{
  if(brandIntroDone)return;
  if(error?.name==="NotAllowedError"){
   video.pause();video.currentTime=0;
   intro.classList.add("needsGesture");intro.tabIndex=0;
  }else finishBrandIntro();
 };
 intro.addEventListener("click",event=>{
  if(event.target.closest("#brandIntroSkip")||!intro.classList.contains("needsGesture"))return;
  startAudible();
 });
 intro.addEventListener("keydown",event=>{
  if(!intro.classList.contains("needsGesture")||!["Enter"," "].includes(event.key))return;
  event.preventDefault();startAudible();
 });
 startAudible();
}

</script>
